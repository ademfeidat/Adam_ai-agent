        color: rgba(229, 245, 235, 0.45);

      }
      @keyframes ademPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.92); }
      }
      @keyframes ademShimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }

    <!-- 5. AI Studio Environment Shield -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason;
            var str = String((reason && (reason.stack || reason.message)) || reason || '');
            if (str.includes('WebSocket') || str.includes('vite') || str.includes('@vite/client') || str.includes('WebSocket closed without opened')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
          window.addEventListener('error', function(event) {
            var msg = String((event && (event.message || event.filename)) || '');
            if (msg.includes('WebSocket') || msg.includes('@vite/client')) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);
        }
      })();
    </script>

    <script>
      // Service Worker registration for PWA - safe environment detection
      if ('serviceWorker' in navigator) {
        var isDevOrPreview = window.location.hostname.includes('run.app') ||
                             window.location.hostname.includes('localhost') ||
                             window.location.hostname === '127.0.0.1';
        if (isDevOrPreview) {
          // Clear any registered service workers in development/preview to prevent stale module caching
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var registration of registrations) {
              registration.unregister();
            }
          }).catch(function() {});
        } else if (window.location.protocol.startsWith('http')) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }
      }
    </script>
