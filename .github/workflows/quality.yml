name: Adam AI Quality

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: Run complete test suite
        run: npm test
      - run: npm run build
      - run: echo "ADAM swarm quality gate passed"
