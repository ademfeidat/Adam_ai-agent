name: Android Preview
on:
  workflow_dispatch:
  push:
    branches: [main, master, "rebuild/adam-ai-v2"]
  pull_request:
    paths:
      - "src/**"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-preview.yml"

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: CAPACITOR_BUILD=true npm run build
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Sync Capacitor
        run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Force Gradle JDK 21
        working-directory: android
        run: echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
      - name: Build debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adam-ai-v2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
