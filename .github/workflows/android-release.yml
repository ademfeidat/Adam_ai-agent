name: Android APK Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: CAPACITOR_BUILD=true npm run build
      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Force Gradle JDK 21
        working-directory: android
        run: echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
      - name: Ensure release keystore
        run: |
          mkdir -p android/app
          if [ ! -f android/app/release.keystore ]; then
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias adamkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android123 \
              -keypass android123 \
              -dname "CN=Adam AI Agent, O=Adam, C=US" \
              -storetype PKCS12
          fi
          echo "=== Android Keystore SHA Fingerprints for Google Cloud Console ==="
          "$JAVA_HOME/bin/keytool" -list -v -keystore android/app/release.keystore -alias adamkey -storepass android123 | grep -E "SHA1:|SHA256:" || true
      - name: Build release APK
        working-directory: android
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace
      - name: Verify APK and prepare download
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -type f -name 'app-release.apk' -print -quit || true)"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "No release APK was produced. Searching build outputs:"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          echo "Found APK: $APK"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -perm -u+x -print -quit 2>/dev/null || true)"
          ZIPALIGN="$(find "${ANDROID_HOME}/build-tools" -type f -name zipalign -perm -u+x -print -quit 2>/dev/null || true)"
          if [ -n "$APKSIGNER" ]; then
            if ! "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
              echo "APK is not signed or signature failed verification, signing now with apksigner..."
              if [ -n "$ZIPALIGN" ]; then
                "$ZIPALIGN" -f -v 4 "$APK" "$APK.aligned" || true
                if [ -f "$APK.aligned" ]; then mv "$APK.aligned" "$APK"; fi
              fi
              "$APKSIGNER" sign --ks android/app/release.keystore --ks-pass pass:android123 --ks-key-alias adamkey --key-pass pass:android123 --out "$APK.signed" "$APK"
              mv "$APK.signed" "$APK"
            fi
            "$APKSIGNER" verify --verbose "$APK" || echo "apksigner verification note"
          fi
          mkdir -p release
          VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA::7}}"
          VERSION="${VERSION//\//-}"
          cp "$APK" "release/Adam-AI-Agent-${VERSION}.apk"
          ls -lh release/*.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adam-AI-Agent-release-apk
          path: release/*.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.apk
